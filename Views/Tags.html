<script>


    // State variables
    let tags = [];
    // let schools = [];
    let search = '';
    let entriesPerPage = 10;
    let page = 1;
    let sort = { key: '', dir: 'asc' };
    let editId = null;
    let showFilters = false;

    
    const elements = {
        nameInput: document.getElementById("nameInput"),
        tagSlug: document.getElementById("tagSlug"),
        tagColor: document.getElementById("tagColor"),
        tagDescription: document.getElementById("tagDescription"),
        drawer: document.getElementById('sectionDrawer'),
        title: document.getElementById('drawerTitle'),
        submitBtn: document.getElementById('submitBtn'),
        tableInfo: document.getElementById('tableInfo'),
        paginationNav: document.getElementById('paginationNav'),
        filterBar: document.getElementById('filterBar'),
        tableBody: document.getElementById('tableBody'),
    }
    

    

    // Filter data based on search
    function filterData() {
      return tags.filter(p => {
        return (
            !search 
            || p.tagName.toLowerCase().includes(search.toLowerCase())
            || p.tagSlug.toLowerCase().includes(search.toLowerCase())
            );
      });
    }
    

    // Paginate data
    function paginateData(data) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      return data.slice(start, end);
    }

    // Update table with current data
    function updateTable() {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));

      // Update table body
      elements.tableBody.innerHTML = '';
      if (paginated.length === 0) {
        elements.tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-400">No Tag Found.</td></tr>';
      } else {
        paginated.forEach((s, i) => {
          const tr = document.createElement('tr');
          tr.className = `hover:bg-blue-50 transition duration-150 cursor-pointer`;
          tr.innerHTML = `
            <td class="py-3 px-4 border-b border-gray-200 text-center">${(page - 1) * entriesPerPage + i + 1}</td>
            <td class="py-3 px-4 border-b border-gray-200">
                ${s.tagName}
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${s.tagSlug}</td>
            <td class="py-3 px-4 border-b border-gray-200"><textarea readonly>${s.tagDescription}</textarea></td>
            <td class="py-3 px-4 border-b border-gray-200">
                ${s.tagColor}
            </td>
            <td class="py-3 px-4 border-b border-gray-200">
              <span id="isActiveStatus" data-id="${s.ltId}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${s.status == 'isActive' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                <span class="w-2 h-2 ${s.status == 'isActive' ? 'bg-green-500' : 'bg-red-500'} rounded-full mr-1.5"></span>
                ${s.status == 'isActive' ? 'Active' : 'Not Active'}
              </span>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${formatTime(s.createdAt)}</td>
            <td class="py-3 px-4 border-b border-gray-200">${formatTime(s.updatedAt)}</td>
            <td class="py-3 px-4 border-b border-gray-200">
              <div class="flex justify-center">
                <button aria-label="Edit" class="text-gray-500 hover:text-blue-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-edit text-xl text-green-500"></i>
                </button>
                <button aria-label="Delete" class="text-gray-500 hover:text-red-600 mx-1 focus:outline-none" data-id="${s.ltId}">
                  <i class="fas fa-trash-alt text-xl text-red-400"></i>
                </button>
              </div>
            </td>
          `;
          elements.tableBody.appendChild(tr);
        });
      }

      // Update pagination
      updatePagination(total, totalPages);

      // Update table info
      const start = total === 0 ? 0 : (page - 1) * entriesPerPage + 1;
      const end = Math.min(page * entriesPerPage, total);
      elements.tableInfo.textContent = `Showing ${start} to ${end} of ${total} entries`;

      // Add event listeners to table elements
      addTableEventListeners();
    }

function updatePagination(total, totalPages) {
  elements.paginationNav.innerHTML = `
    <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50" id="prevPageBtn" ${page === 1 ? 'Inactive' : ''}>
      <i class="fas fa-chevron-left text-xs"></i>
    </button>
  `;

  const maxButtons = 5;
  let startPage, endPage;

  if (totalPages <= maxButtons) {
    startPage = 1;
    endPage = totalPages;
  } else if (page <= 3) {
    startPage = 1;
    endPage = 5;
  } else if (page >= totalPages - 2) {
    startPage = totalPages - 4;
    endPage = totalPages;
  } else {
    startPage = page - 2;
    endPage = page + 2;
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
    btn.textContent = i;
    btn.Inactive = page === i;
    btn.addEventListener('click', () => {
      page = i;
      updateTable();
    });
    elements.paginationNav.appendChild(btn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50`;
  nextBtn.id = 'nextPageBtn';
  nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
  nextBtn.Inactive = page === totalPages;
  nextBtn.addEventListener('click', () => {
    if (page < totalPages) {
      page++;
      updateTable();
    }
  });
  elements.paginationNav.appendChild(nextBtn);

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (page > 1) {
      page--;
      updateTable();
    }
  });
}

//  <td class="py-3 px-4 border-b border-gray-200">${getSchoolName(s.schoolId)}</td>

    // Add event listeners to table elements
    function addTableEventListeners() {
      // Select all checkbox

      // Sort buttons
      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sortKey = e.currentTarget.getAttribute('data-sort');
          handleSort(sortKey);
        });
      });
      
      // Edit buttons
      document.querySelectorAll('button[aria-label="Edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          handleEdit(ltId);
        });
      });

      // Delete buttons
      document.querySelectorAll('button[aria-label="Delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          deleteTag(ltId);
        });
      });
      
      
    }

    async function handleDelete(ltId) {
        tags = tags.filter(s => +s.ltId !== +ltId);
        updateTable();
   
    }
    
    
    
    
    

    // package drawer functions
    function openProfileDrawer() {
      const modalLabel = document.getElementById('modalLabel');
 
    // 1. Find the tag
      const tag = tags.find(p => p.ltId == editId);
        // update the title 
      modalLabel.innerHTML = editId ? `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${tag?.tagName} </span> Tag` : ` <i class="fas fa-plus mr-2"></i> New Tag`; 
      
      elements.drawer.classList.remove('hidden');
    };

    function closeProfileDrawer() {
      elements.drawer.classList.add('hidden');
      document.getElementById('modalLabel').innerHTML = '';
      document.getElementById('tagForm').reset();
      editId = null;
    };
    

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      let formData = new FormData(document.getElementById('tagForm'));

      if(!formData.get('tagName') || formData.get('tagName').trim() == ''){
          Swal.fire('Notice!!!', `Tag Name field is required`, 'warning');
          return;
      }

        formData.set('tagSlug', elements.tagSlug.value); 
    
        if (editId) {
            const formEdit = Object.fromEntries(formData.entries());

          // Update Package
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to update this tag?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Update',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                    try{
                        
                        const response = await fetch(`${BASE_URL}/blogs/tags/${editId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            body: JSON.stringify(formEdit)
                        });
                        
                        const result = await response.json();
                        const {responseData, responseCategory, responseResult} = result;
 
                        if(responseCategory == 200){
                              // update the table
                            tags = tags.map(s => +s.ltId === +editId ? {
                                ...s,
                                ...responseData
                              } : s);
                
                            Swal.fire('Notice!!!', 'Updated Successfully', 'success').then(function(){
                                elements.submitBtn.textContent = 'Update';
                                updateTable();
                                closeProfileDrawer();
                            });
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.textContent = 'Update';
                             
                            })
                            
                        }
    
                    }catch(error){
                        Swal.fire('Error!!!', `${error}`, 'warning');
                         elements.submitBtn.innerHTML = 'Update';
                      
                    }
                }
            });

        } else {
          
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to add this tag?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Add',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                    try {
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                        // 4. The Direct Fetch Call
                        const response = await fetch(`${BASE_URL}/blogs/tags`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            body: formData
                        });
                    
                        // 5. Parse the JSON response
                        const result = await response.json();
                         const {responseData, responseCategory, responseResult} = result;
                    
                        if(responseCategory == 200){
                            const data = {...responseData, status:'isActive'};
                            tags = [...tags, data];

                            Swal.fire('Notice!!!', 'Tag Added successfully', 'success').then(function(){
                                 elements.submitBtn.innerHTML = 'Submit';
                                    closeProfileDrawer();
                                    updateTable();
                            });
    
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.innerHTML = 'Submit';
                            })
                        }
                    
                    } catch (error) {
                        // 7. Handle Network Errors (e.g., DNS issues, offline)
                        console.error('Network Error:', error);
                        Swal.fire('Error', 'Network error occurred', 'error');
                    }
            
                }
            }); 

        }
        

    }

   function handleEdit(ltId) {
       
       
    const modalLabel = document.getElementById('modalLabel');

    // 1. Find the tag
    const tag = tags.find(p => p.ltId == ltId);
    if (!tag) return;
       // storing the ID somewhere for Updating
    editId = ltId;
    
     
    // update the title 
    modalLabel.innerHTML = `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${tag?.tagName} </span> Tag`;

    const form = document.getElementById('tagForm');

    // ---------------------------------------------------------
    // A. Standard Fields (Text, Email, Select, Textarea)
    // ---------------------------------------------------------
    const fields = [
        'tagName', 'tagDescription', 'tagSlug', 'tagColor'
    ];

    fields.forEach(field => {
        const input = form.querySelector(`[name="${field}"]`);
        // Check if input exists and tag has data for it
        if (input && tag[field] !== undefined && tag[field] !== null) {
            input.value = tag[field];
        } else if (input) {
            input.value = ''; // Clear if data is null
        }
    });

    // elements.schoolSelect.innerHTML = populateSchool(tag.schoolId);
    
    // D. Open the Drawer / Modal
    openProfileDrawer();
    
 
}

    
    //// Delete event Listener
     function deleteTag(ltId){
        let res = tags.find(s => s.ltId == ltId);

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to delete this tag?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
   
                try{
                    
                     const response = await fetch(`${BASE_URL}/blogs/tags/${ltId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                    const data = await response.json();
                    
                    const {responseData, responseResult, responseCategory} = data;
                    if(responseCategory == '200'){
                        let msg = `Tag Deleted successfully ✌️`;
                        Swal.fire('Notice!!!',msg,'success').then(function(){
                            handleDelete(ltId);
                        });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    Swal.fire('Error!!!', `${error}`, 'warning');
                }
            }
        }); 
    
    };

    // Initialize event listeners
    function initEventListeners() {
        
    //      ///  is Enabled Event Listenere
    document.addEventListener('click', function(e){
        let btn = e.target.closest('#isActiveStatus');
        if(!btn) return;
        let ltId = btn.dataset.id;
        
        let res = tags.find(res => res.ltId == ltId);
        let resStatusText = res.status == 'isActive'  ? 'deactivate' : 'activate';

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to ${resStatusText} this tag?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: `Yes, ${resStatusText}`,
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
                try{
                    
                     const response = await fetch(`${BASE_URL}/blogs/tags/${ltId}/toggle-active`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                     const data = await response.json();

                     const {responseData, responseResult, responseCategory} = data;

                    if(responseCategory == '200'){
                         Swal.fire('Notice!!!', `${res.tagName} ${resStatusText}d successfully`, 'success').then(function(){
                             tags = tags.map(tag => +tag.ltId === +ltId ? {...tag, status: tag.status == 'isActive' ? 'isNotActive' : 'isActive'} : tag);
                                updateTable();
                         });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    console.log(error);
                }
            }
        });
        
       
        
    })
  
        elements.nameInput.addEventListener('input', function(){
            elements.tagSlug.value = replaceSpaceWithHyphen(this.value);
        })
        
        function replaceSpaceWithHyphen(text){
            let txt = text.trim().replaceAll(" ", '-').toLowerCase();
            return txt;
        }
  
      // Search
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        search = e.target.value;
        page = 1;
        updateTable();
      });

      // Clear filters
      document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
        search = '';
        document.getElementById('searchInput').value = '';
        page = 1;
        updateTable();
      });

      // Entries per page
      document.getElementById('entriesPerPageSelect')?.addEventListener('change', (e) => {
        entriesPerPage = parseInt(e.target.value);
        page = 1;
        updateTable();
      });

      // Toggle filters
      document.getElementById('toggleFiltersBtn')?.addEventListener('click', () => {
        showFilters = !showFilters;
        elements.filterBar.classList.toggle('hidden', !showFilters);
      });

    //   // Add Package
      document.getElementById('addTagBtn')?.addEventListener('click', () => {
        editId = null;
        // elements.schoolSelect.innerHTML = populateSchool();
        openProfileDrawer();
      });

    

    //   // Drawer buttons
      document.getElementById('closeDrawerBtn')?.addEventListener('click', closeProfileDrawer);
      document.getElementById('cancelBtn')?.addEventListener('click', closeProfileDrawer);
      elements.submitBtn?.addEventListener('click', handleFormSubmit);
        
        
    }
    
    
    // Initialize the application
    function init() {
        
        async function onLoadTag(){
              
            fx_lifetech_button_loader_open();
            try{
                
                const response = await fetch(`${BASE_URL}/blogs/tags`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${LW_TOKEN}`,
                        'Accept': 'application/json'

                    }
                });
                
               const tagData = await response.json();
                 
                const { responseData, responseResult, responseCategory } = tagData;
                 
                 if(responseCategory == 200){
                     tags = Array.isArray(responseData) ? responseData : [];
        
                     updateTable();
                 }else{
                     Swal.fire('Notice!!!', `${responseResult}`, 'warning')
                 }
                 
                 fx_lifetech_button_loader_close(); 
            }catch(error){
                 
                 console.log(error);
    
            }
             
         }
         
        onLoadTag();    
        
        
      initEventListeners();
    //   updateTable();
    }

    document.addEventListener('DOMContentLoaded', init);
    
    
    
  </script>
  </body>
