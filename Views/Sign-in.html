<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — MdBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#4F46E5",
                hover: "#4338CA",
                light: "#EEF2FF",
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-full flex flex-col font-sans">

    <main class="flex-grow flex items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-2xl relative overflow-hidden"
      >
        <div class="mb-6">
          <h2 class="text-2xl font-black text-slate-900">Welcome back</h2>
          <p class="text-xs text-slate-500 mt-1">
            Sign in to publish articles, save reads, and join discussions.
          </p>
        </div>

        <form id="signin-form" class="space-y-4">
          <div>
            <label
              for="signin-email"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Email Address</label
            >
            <div class="relative group">
              <i
                class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="email"
                id="signin-email"
                required
                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label
                for="signin-password"
                class="text-xs font-semibold uppercase tracking-wider text-slate-600"
                >Password</label
              >
            </div>
            <div class="relative group">
              <i
                class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="password"
                id="signin-password"
                required
                class="w-full pl-9 pr-10 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('signin-password', this)"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors"
              >
                <i class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="w-full mt-2 py-3 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-bold shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2"
          >
            <span>Sign In to Account</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
          Don't have an account yet?
          <a
            href="<?= ltSiteUrl() ?>/MdBlog/Sign-up"
            class="text-primary hover:text-primary-hover font-bold transition-colors"
            >Create one now</a
          >
        </div>
      </div>
    </main>

    <script>

      const setButtonLoading = (btn, isLoading, originalText = "") => {
        if (isLoading) {
          btn.dataset.original = btn.innerHTML;
          btn.innerHTML =
            "<div class='w-4 h-4 rounded-full border-2 border-white border-t-transparent animate-spin mx-auto'></div>";
          btn.disabled = true;
        } else {
          btn.innerHTML = btn.dataset.original || originalText;
          btn.disabled = false;
        }
      };

      document
        .getElementById("signin-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          const email = document.getElementById("signin-email").value.trim();
          const password = document.getElementById("signin-password").value;

          setButtonLoading(btn, true);

          try {
            const response = await fetch(`${BASE_URL}/blogs/auth/signin`, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password }),
            });

            const { responseCategory, responseResult, responseData } =
              await response.json();

            if (responseCategory == "200") {
              let tokenName = responseData.tokenName;
              let tokenValue = responseData[tokenName];
              let userDetailsKey =
                tokenName.split("_").slice(1).join("_") + "_userDetails";
                Swal.fire('Bravo!!!', `Signed in successfully!`, 'success');

              localStorage.setItem(`${tokenName}`, tokenValue);
              const userInfo = {
                ltId: responseData.ltId,
                username: responseData.username,
              };
              localStorage.setItem(
                `${userDetailsKey}`,
                JSON.stringify(userInfo),
              );
              setTimeout(
                () =>
                  (window.location.href = `${siteHostAddress}/MdBlog/User-profile`),
                800,
              );
            } else {
                Swal.fire('Notice!!!', `${responseResult || "Authentication failed"}`, 'warning');
            }
          } catch (err) {
            console.error("Signin Error:", err);
              Swal.fire('Oops!!!', `Network error occurred.`, 'warning');
          } finally {
            setButtonLoading(btn, false, "Sign In");
          }
        });

      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "fa-regular fa-eye-slash text-xs text-blue-600";
        } else {
          input.type = "password";
          icon.className = "fa-regular fa-eye text-xs text-slate-400";
        }
      }
    </script>
  </body>
</html>
