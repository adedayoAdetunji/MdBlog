<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — MdBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#4F46E5",
                hover: "#4338CA",
                light: "#EEF2FF",
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-full flex flex-col font-sans">

    <main class="flex-grow flex items-center justify-center px-4 py-12">
      <div
        class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-2xl relative overflow-hidden"
      >
        <div class="mb-6">
          <h2 class="text-2xl font-black text-slate-900">Create an account</h2>
          <p class="text-xs text-slate-500 mt-1">
            Join our publication community of writers and engineers.
          </p>
        </div>

        <form id="signup-form" class="space-y-4">
          <div>
            <label
              for="signup-name"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Full Name *</label
            >
            <div class="relative group">
              <i
                class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="text"
                id="signup-name"
                required
                placeholder="Alex Morgan"
                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
            </div>
          </div>

          <div>
            <label
              for="signup-username"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Username *</label
            >
            <div class="relative group">
              <i
                class="fa-solid fa-at absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="text"
                id="signup-username"
                required
                placeholder="alexm"
                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
            </div>
          </div>

          <div>
            <label
              for="signup-email"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Email Address *</label
            >
            <div class="relative group">
              <i
                class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="email"
                id="signup-email"
                required
                placeholder="alex.morgan@example.com"
                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
            </div>
          </div>

          <div>
            <label
              for="signup-password"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Password *</label
            >
            <div class="relative group">
              <i
                class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="password"
                id="signup-password"
                required
                placeholder="Min. 8 characters"
                class="w-full pl-9 pr-10 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
              <button
                type="button"
                onclick="togglePasswordVisibility('signup-password', this)"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors"
              >
                <i class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div>
            <label
              for="signup-confirm-password"
              class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5"
              >Confirm Password *</label
            >
            <div class="relative group">
              <i
                class="fa-solid fa-check-double absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"
              ></i>
              <input
                type="password"
                id="signup-confirm-password"
                required
                placeholder="Repeat password"
                class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-primary transition-all"
              />
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-3 mt-2 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-bold shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2"
          >
            <span>Create Account</span>
            <i class="fa-solid fa-user-check text-xs"></i>
          </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
          Already have an account?
          <a
            href="<?= ltSiteUrl() ?>/MdBlog/Sign-in"
            class="text-primary hover:text-primary-hover font-bold transition-colors"
            >Sign in instead</a
          >
        </div>
      </div>
    </main>

    <script>

      const setButtonLoading = (btn, isLoading, originalText = "") => {
        if (isLoading) {
          btn.dataset.original = btn.innerHTML;
          btn.innerHTML =
            "<div class='w-4 h-4 rounded-full border-2 border-white border-t-transparent animate-spin mx-auto'></div>";
          btn.disabled = true;
        } else {
          btn.innerHTML = btn.dataset.original || originalText;
          btn.disabled = false;
        }
      };

      document
        .getElementById("signup-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector('button[type="submit"]');
          const name = document.getElementById("signup-name").value.trim();
          const email = document.getElementById("signup-email").value.trim();
          const pass = document.getElementById("signup-password").value;
          const username = document
            .getElementById("signup-username")
            .value.trim();
          const confirmPass = document.getElementById(
            "signup-confirm-password",
          ).value;

          if (pass !== confirmPass) {
              Swal.fire('Oops!!!', `Passwords do not match!`, 'warning');
            return;
          }

          if (username.length === 0 || email.length === 0) {
              Swal.fire('Oops!!!', `Username or Email must not be empty`, 'warning');
            return;
          }

          if (pass.length < 8) {
              Swal.fire('Oops!!!', `Password must be at least 8 characters!`, 'warning');
            return;
          }

          setButtonLoading(btn, true);

          try {
            const response = await fetch(`${BASE_URL}/blogs/auth/signup`, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                name,
                email,
                password: pass,
                username,
                confirmPass,
              }),
            });

            const { responseCategory, responseResult, responseData } =
              await response.json();

            if (responseCategory == "200") {
                Swal.fire('Bravo!!!', `Account created for ${name}! continue by signing in`, 'success');
              setTimeout(() => {
                window.location.href = `${siteHostAddress}/MdBlog/Sign-in`;
              }, 800);
            } else {
                Swal.fire('Oops!!!', `${responseResult || "Registration failed"}`, 'warning');
            }
          } catch (err) {
            console.error("Signup Error:", err);
              Swal.fire('Oops!!!', `Network error occurred.`, 'warning');
          } finally {
            setButtonLoading(btn, false, "Create Account");
          }
        });

      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "fa-regular fa-eye-slash text-xs text-blue-600";
        } else {
          input.type = "password";
          icon.className = "fa-regular fa-eye text-xs text-slate-400";
        }
      }
    </script>
  </body>
</html>
