    <script>
      // State variables
      let SETTINGS = [];
      let search = "";
      let entriesPerPage = 10;
      let page = 1;
      let sort = { key: "", dir: "asc" };
      let editId = null;
      let showFilters = false;

      const elements = {
        settingInput: document.getElementById("settingInput"),
        settingValue: document.getElementById("settingValue"),
        drawer: document.getElementById("sectionDrawer"),
        submitBtn: document.getElementById("submitBtn"),
        tableInfo: document.getElementById("tableInfo"),
        paginationNav: document.getElementById("paginationNav"),
        filterBar: document.getElementById("filterBar"),
        tableBody: document.getElementById("tableBody"),
        searchInput: document.getElementById("searchInput"),
        entriesPerPageSelect: document.getElementById("entriesPerPageSelect"),
      };

      // Filter data based on search
      function filterData() {
        return SETTINGS.filter((p) => {
          return (
            !search ||
            p.settingKey.toLowerCase().includes(search.toLowerCase())
          );
        });
      }

      // Paginate data
      function paginateData(data) {
        const start = (page - 1) * entriesPerPage;
        const end = start + entriesPerPage;
        return data.slice(start, end);
      }


      // Update table with current data
      function updateTable() {
        const filtered = filterData();
        const paginated = paginateData(filtered);
        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));

        // Update table body
        elements.tableBody.innerHTML = "";
        if (paginated.length === 0) {
          elements.tableBody.innerHTML =
            '<tr><td colspan="7" class="text-center py-6 text-gray-400 dark:text-gray-500">No Setting Found.</td></tr>';
        } else {
          paginated.forEach((s, i) => {
            const tr = document.createElement("tr");
            tr.className = `hover:bg-blue-50 dark:hover:bg-gray-800 transition duration-150 cursor-pointer border-b border-gray-200 dark:border-gray-800`;
            tr.innerHTML = `
              <td class="py-3 px-4 text-center">${(page - 1) * entriesPerPage + i + 1}</td>
              <td class="py-3 px-4">
                <div class="flex items-center gap-1">
                  <div class="font-medium text-blue-700 dark:text-blue-400">${s.settingKey}</div>
                  <span id="viewLoader"></span>
                </div>
              </td>
              <td class="py-3 px-4">${s.settingValue || ""}</td>
              <td class="py-3 px-4">
                <span id="isActiveStatus" data-id="${s.ltId}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${s.status == "isActive" ? "bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200" : "bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200"}">
                  <span class="w-2 h-2 ${s.status == "isActive" ? "bg-green-500" : "bg-red-500"} rounded-full mr-1.5"></span>
                  ${s.status == "isActive" ? "Active" : "Not Active"}
                </span>
              </td>
              <td class="py-3 px-4 text-gray-700 dark:text-gray-300">${mdblogFormatTime(s.createdAt)}</td>
              <td class="py-3 px-4 text-gray-700 dark:text-gray-300">${mdblogFormatTime(s.updatedAt)}</td>
              <td class="py-3 px-4">
                <div class="flex justify-center">
                  <button aria-label="Edit" class="text-green-500 hover:text-green-700 dark:hover:text-green-400 mx-1 focus:outline-none transition-colors" data-id="${s.ltId}">
                    <i class="fas fa-edit text-xl"></i>
                  </button>
                  <button aria-label="Delete" class="text-red-400 hover:text-red-600 dark:hover:text-red-300 mx-1 focus:outline-none transition-colors" data-id="${s.ltId}">
                    <i class="fas fa-trash-alt text-xl"></i>
                  </button>
                </div>
              </td>
            `;
            elements.tableBody.appendChild(tr);
          });
        }

        // Update pagination
        updatePagination(total, totalPages);

        // Update table info
        const start = total === 0 ? 0 : (page - 1) * entriesPerPage + 1;
        const end = Math.min(page * entriesPerPage, total);
        elements.tableInfo.textContent = `Showing ${start} to ${end} of ${total} entries`;

        // Add event listeners to table elements
        addTableEventListeners();
      }


      // Add event listeners to table elements
    function updatePagination(total, totalPages) {
        elements.paginationNav.innerHTML = `
          <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors Inactive:opacity-50" id="prevPageBtn" ${page === 1 ? "Inactive" : ""}>
            <i class="fas fa-chevron-left text-xs"></i>
          </button>
        `;

        const maxButtons = 5;
        let startPage, endPage;

        if (totalPages <= maxButtons) {
          startPage = 1;
          endPage = totalPages;
        } else if (page <= 3) {
          startPage = 1;
          endPage = 5;
        } else if (page >= totalPages - 2) {
          startPage = totalPages - 4;
          endPage = totalPages;
        } else {
          startPage = page - 2;
          endPage = page + 2;
        }

        for (let i = startPage; i <= endPage; i++) {
          const btn = document.createElement("button");
          btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-700 text-sm font-medium transition-colors ${page === i ? "bg-blue-600 dark:bg-blue-700 text-white" : "bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"}`;
          btn.textContent = i;
          btn.Inactive = page === i;
          btn.addEventListener("click", () => {
            page = i;
            updateTable();
          });
          elements.paginationNav.appendChild(btn);
        }

        const nextBtn = document.createElement("button");
        nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors Inactive:opacity-50`;
        nextBtn.id = "nextPageBtn";
        nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
        nextBtn.Inactive = page === totalPages;
        nextBtn.addEventListener("click", () => {
          if (page < totalPages) {
            page++;
            updateTable();
          }
        });
        elements.paginationNav.appendChild(nextBtn);

        document.getElementById("prevPageBtn").addEventListener("click", () => {
          if (page > 1) {
            page--;
            updateTable();
          }
        });
      }


    // Add event listeners to table elements
    function addTableEventListeners() {
      // Select all checkbox

      // Sort buttons
      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sortKey = e.currentTarget.getAttribute('data-sort');
          handleSort(sortKey);
        });
      });
      
      // Edit buttons
      document.querySelectorAll('button[aria-label="Edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          handleEdit(ltId);
        });
      });

      // Delete buttons
      document.querySelectorAll('button[aria-label="Delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          deleteSetting(ltId);
        });
      });
      
      
    }

    async function handleDelete(ltId) {
        SETTINGS = SETTINGS.filter(s => +s.ltId !== +ltId);
        updateTable();
   
    }

      // Open drawer
      function openProfileDrawer() {
        const modalLabel = document.getElementById("modalLabel");
        const setting = SETTINGS.find((p) => p.ltId == editId);
        modalLabel.innerHTML = editId
          ? `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${setting?.settingKey} </span> Setting`
          : `<i class="fas fa-plus mr-2"></i> New Setting`;
        elements.drawer.classList.remove("hidden");
      }

      // Close drawer
      function closeProfileDrawer() {
        elements.drawer.classList.add("hidden");
        document.getElementById("modalLabel").innerHTML = "";
        document.getElementById("settingForm").reset();
        editId = null;
      }

      // Handle form submit
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      let formData = new FormData(document.getElementById('settingForm'));

      if(!formData.get('settingKey') || formData.get('settingKey').trim() == ''){
          Swal.fire('Notice!!!', `Setting Key field is required`, 'warning');
          return;
      }

    
        if (editId) {
            const formEdit = Object.fromEntries(formData.entries());

          // Update Package
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to update this setting?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Update',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                    try{
                        
                        const response = await fetch(`${MDBLOG_BASE_URL}/blogs/settings/${editId}`, {
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${MDBLOG_LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            body: JSON.stringify(formEdit)
                        });
                        
                        const result = await response.json();
                        const {responseData, responseCategory, responseResult} = result;
 
                        if(responseCategory == 200){
                              // update the table
                            SETTINGS = SETTINGS.map(s => +s.ltId === +editId ? {
                                ...s,
                                ...responseData
                              } : s);
                
                            Swal.fire('Notice!!!', 'Updated Successfully', 'success').then(function(){
                                elements.submitBtn.textContent = 'Update';
                                updateTable();
                                closeProfileDrawer();
                            });
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.textContent = 'Update';
                             
                            })
                            
                        }
    
                    }catch(error){
                        Swal.fire('Error!!!', `${error}`, 'warning');
                         elements.submitBtn.innerHTML = 'Update';
                      
                    }
                }
            });

        } else {
          
            Swal.fire({
                title: 'Notice!',
                text: 'Are you sure you want to add this setting?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Add',
                cancelButtonText: 'No, Cancel'
            }).then(async result => {
                if (result.isConfirmed) {
                    
                    try {
                        elements.submitBtn.innerHTML = '<span class="animate-pulse">processing...</span>';
                        // 4. The Direct Fetch Call
                        const response = await fetch(`${MDBLOG_BASE_URL}/blogs/settings`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${MDBLOG_LW_TOKEN}`,
                                'Accept': 'application/json'
    
                            },
                            body: formData
                        });
                    
                        // 5. Parse the JSON response
                        const result = await response.json();
                         const {responseData, responseCategory, responseResult} = result;
                    
                        if(responseCategory == 200){
                            const data = {...responseData, status:'isActive'};
                            SETTINGS = [...SETTINGS, data];

                            Swal.fire('Notice!!!', 'Setting Added successfully', 'success').then(function(){
                                 elements.submitBtn.innerHTML = 'Submit';
                                    closeProfileDrawer();
                                    updateTable();
                            });
    
                        }else{
                            Swal.fire('Error!!!', `${responseResult}`, 'warning').then(function(){
                                elements.submitBtn.innerHTML = 'Submit';
                            })
                        }
                    
                    } catch (error) {
                        // 7. Handle Network Errors (e.g., DNS issues, offline)
                        console.error('Network Error:', error);
                        Swal.fire('Error', 'Network error occurred', 'error');
                    }
            
                }
            }); 

        }
        

    }
    

   function handleEdit(ltId) {
       
       
    const modalLabel = document.getElementById('modalLabel');

    // 1. Find the setting
    const setting = SETTINGS.find(p => p.ltId == ltId);
    if (!setting) return;
       // storing the ID somewhere for Updating
    editId = ltId;
    
     
    // update the title 
    modalLabel.innerHTML = `<i class="fas fa-edit mr-2"></i>Edit <span class="mx-1 text-amber-400"> ${setting?.settingKey} </span> Setting`;

    const form = document.getElementById('settingForm');

    // ---------------------------------------------------------
    // A. Standard Fields (Text, Email, Select, Textarea)
    // ---------------------------------------------------------
    const fields = [
        'settingKey', 'settingValue'
    ];

    fields.forEach(field => {
        const input = form.querySelector(`[name="${field}"]`);
        // Check if input exists and setting has data for it
        if (input && setting[field] !== undefined && setting[field] !== null) {
            input.value = setting[field];
        } else if (input) {
            input.value = ''; // Clear if data is null
        }
    });

    // elements.schoolSelect.innerHTML = populateSchool(setting.schoolId);
    
    // D. Open the Drawer / Modal
    openProfileDrawer();
    
 
}

    function deleteSetting(ltId){
        let res = SETTINGS.find(s => s.ltId == ltId);

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to delete this setting?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
   
                try{
                    
                     const response = await fetch(`${MDBLOG_BASE_URL}/blogs/settings/${ltId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${MDBLOG_LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                    const data = await response.json();
                    
                    const {responseData, responseResult, responseCategory} = data;
                    if(responseCategory == '200'){
                        let msg = `Setting Deleted successfully ✌️`;
                        Swal.fire('Notice!!!',msg,'success').then(function(){
                            handleDelete(ltId);
                        });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    Swal.fire('Error!!!', `${error}`, 'warning');
                }
            }
        }); 
    
    };

    // Initialize event listeners
    function initEventListeners() {
        
    //      ///  is Enabled Event Listenere
    document.addEventListener('click', function(e){
        let btn = e.target.closest('#isActiveStatus');
        if(!btn) return;
        let ltId = btn.dataset.id;
        
        let res = SETTINGS.find(res => res.ltId == ltId);
        let resStatusText = res.status == 'isActive'  ? 'deactivate' : 'activate';

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to ${resStatusText} this setting?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: `Yes, ${resStatusText}`,
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
                try{
                    
                     const response = await fetch(`${MDBLOG_BASE_URL}/blogs/settings/${ltId}/toggle-active`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${MDBLOG_LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                     const data = await response.json();

                     const {responseData, responseResult, responseCategory} = data;

                    if(responseCategory == '200'){
                         Swal.fire('Notice!!!', `${res.settingKey} ${resStatusText}d successfully`, 'success').then(function(){
                             SETTINGS = SETTINGS.map(setting => +setting.ltId === +ltId ? {...setting, status: setting.status == 'isActive' ? 'isNotActive' : 'isActive'} : setting);
                                updateTable();
                         });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    console.log(error);
                }
            }
        });
        
       
        
    })
  
      // Search
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        search = e.target.value;
        page = 1;
        updateTable();
      });

      // Clear filters
      document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
        search = '';
        document.getElementById('searchInput').value = '';
        page = 1;
        updateTable();
      });

      // Entries per page
      document.getElementById('entriesPerPageSelect')?.addEventListener('change', (e) => {
        entriesPerPage = parseInt(e.target.value);
        page = 1;
        updateTable();
      });

      // Toggle filters
      document.getElementById('toggleFiltersBtn')?.addEventListener('click', () => {
        showFilters = !showFilters;
        elements.filterBar.classList.toggle('hidden', !showFilters);
      });

    //   // Add Package
      document.getElementById('addSettingBtn')?.addEventListener('click', () => {
        editId = null;
        // elements.schoolSelect.innerHTML = populateSchool();
        openProfileDrawer();
      });

    

    //   // Drawer buttons
      document.getElementById('closeDrawerBtn')?.addEventListener('click', closeProfileDrawer);
      document.getElementById('cancelBtn')?.addEventListener('click', closeProfileDrawer);
      elements.submitBtn?.addEventListener('click', handleFormSubmit);
      
        
        
    }
    
    
    // Initialize the application
    function init() {
        
        async function onLoadBlogCategories(){
              
            mdblog_fx_lifetech_button_loader_open();
            try{
                
                const response = await fetch(`${MDBLOG_BASE_URL}/blogs/settings`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${MDBLOG_LW_TOKEN}`,
                        'Accept': 'application/json'

                    }
                });
                
               const settingData = await response.json();
                 
                const { responseData, responseResult, responseCategory } = settingData;
                 
                 if(responseCategory == 200){
                     SETTINGS = Array.isArray(responseData) ? responseData : [];
        
                     updateTable();
                 }else{
                     Swal.fire('Notice!!!', `${responseResult}`, 'warning')
                 }
                 
                 mdblog_fx_lifetech_button_loader_close();  
            }catch(error){
                 
                 console.log(error);
    
            }
             
         }
         
        onLoadBlogCategories();    
        
        
      initEventListeners();
    //   updateTable();
    }

    document.addEventListener('DOMContentLoaded', init);
 
 
    </script>
