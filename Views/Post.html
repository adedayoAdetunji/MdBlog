document.addEventListener('DOMContentLoaded', async function(){
// (() => {
  "use strict";
  
let POST = [];
let CATEGORIES = [];


// ============================================
// Helper functions
// ============================================

    
function getCategoryName(catId){
    if(typeof catId == 'string') return catId;
    let cat = CATEGORIES.find(c => Number(c.ltId) === Number(catId)).categoryName;
    return cat;
}

function decodeHtml(html) {
    if (!html) return '';
    const txt = document.createElement('textarea');
    txt.innerHTML = formatMarkdownImages(domParser(html));
    return txt.value;
}

function domParser(content){
    return new DOMParser().parseFromString(content, "text/html").body.textContent;
}

function formatCodeBlocks(text) {
    return text.replace(/'''([\s\S]*?)'''|```([\s\S]*?)```/g, (match, g1, g2) => {
        const codeContent = (g1 || g2 || "").trim();
        return `
            <div class="bg-gray-900 rounded-lg">
                <pre class="text-green-400 font-mono text-xs overflow-x-auto">
                    <code>${codeContent}</code>
                </pre>
            </div>`;
    });
}


function formatMarkdownImages(text) {
    return text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, altText, filename) => {

        // const basePath = '/packages/modules/MdDocs/Media/';
        const basePath = `${siteHostAddress}/packagers/modules/MdDocs/Media/`;
        const fullPath = filename.startsWith('http') || filename.startsWith('/') 
            ? filename 
            : basePath + filename;

        return `
            <div class="my-4 flex justify-center markdown-image-wrapper">
                <img src="${fullPath}" alt="${altText}" 
                     class="max-w-full h-auto rounded-lg shadow-md border border-gray-200">
            </div>
        `;
    });
}

  /* ---------- resolve post ---------- */
//   const params = new URLSearchParams(window.location.search);
//   const id = params.get("id") || POSTS[0].slug;
//   const slug = params.get("slug");
  const SLUG = "<?= $_GET['slug'] ?>";

  /* ---------- helpers ---------- */
   const dateFormatter = new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
    });
  
   function formatDate(iso) {
        if (!iso) return "";
    
        // const date = new Date(`${iso}T00:00:00`);
        const date = new Date(iso.replace(" ", "T"));
    
        return Number.isNaN(date.getTime())
            ? ""
            : dateFormatter.format(date);
    }
    
    
  const formatCount = (n) =>
    n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, "")}k` : String(n);

  const heartIcon = (filled) => `
    <svg class="h-4 w-4 transition ${filled ? "fill-accent text-accent" : "fill-none"}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
    </svg>
  `;

  const toast = (msg) => {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.style.opacity = "1";
    t.style.transform = "translate(-50%, 0)";
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.style.opacity = "0";
      t.style.transform = "translate(-50%, 1rem)";
    }, 2200);
  };

  /* ---------- populate post ---------- */
  
    function renderPost(post) {
        // 1. Populate Core Metadata using exact HTML IDs
        document.getElementById('a-title').textContent = domParser(post.title) || 'Untitled Post';
        document.getElementById('a-category').textContent = post.category;
        document.getElementById('authorName').textContent = post.authorName || 'Unknown';
        document.getElementById('a-date').textContent = formatDate(post.date);
        
        // Fallback for reading time if not saved in DB
        const readingTime = post.readingTime || Math.max(1, Math.ceil((post.content || '').split(' ').length / 200));
        document.getElementById('a-read').textContent = `${readingTime} min read`;
    
        // Views (if you track them)
        document.getElementById('a-views').textContent = post.views || '0';
    
        // Set Author Avatar
        const authorAvatar = document.getElementById('authorImageHolder');
        authorAvatar.src = post.authorAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(post.authorName || 'Teejay')}&background=random`;
    
        // 2. Inject Main Content
        const postBody = document.getElementById('a-body');
        postBody.innerHTML = post.content || '<p>No content available.</p>';
    
        // 3. Render Attached Media (Gallery)
        renderMediaGallery(post.media);
    
        // 4. Auto-Generate Table of Contents
        generateTableOfContents();
    }

    function generateTableOfContents() {
        const postBody = document.getElementById('a-body');
        const tocContainer = document.getElementById('tableOfContents');
        
        // Find all H2 and H3 tags inside the main article
        const headings = postBody.querySelectorAll('h2, h3');
        tocContainer.innerHTML = '';
    
        if (headings.length === 0) {
            // Hide the whole "In this article" block if no headings exist
            tocContainer.parentElement.classList.add('hidden');
            return;
        }
    
        tocContainer.parentElement.classList.remove('hidden');
    
        headings.forEach((heading, index) => {
            // Auto-generate safe anchor IDs if they are missing
            if (!heading.id) {
                heading.id = `toc-${index}-${heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
            }
    
            const li = document.createElement('li');
            const a = document.createElement('a');
            
            a.href = `#${heading.id}`;
            a.textContent = heading.textContent;
            a.className = 'hover:text-accent transition-colors block';
            
            // Indent H3 tags slightly to show hierarchy
            if (heading.tagName.toLowerCase() === 'h3') {
                li.classList.add('pl-4', 'text-muted');
            }
    
            // Smooth scroll behavior
            a.addEventListener('click', (e) => {
                e.preventDefault();
                heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                history.pushState(null, null, `#${heading.id}`);
            });
    
            li.appendChild(a);
            tocContainer.appendChild(li);
        });

        // 1. Lock the background scrolling so the user can't scroll the article while viewing media
        document.body.style.overflow = 'hidden';

        lightbox.classList.remove('hidden');

            contentDiv.classList.remove('scale-95');
            contentDiv.classList.add('scale-100');
        });
    }

        const commentCount = document.getElementById('comment-count');
        
        // 1. Update count recursively
        const countAll = (items) => items.reduce((acc, c) => acc + 1 + countAll(c.replies || []), 0);
        commentCount.textContent = countAll(commentsArray);
        commentList.innerHTML = '';
    
        if (!commentsArray || commentsArray.length === 0) {
            commentList.innerHTML = '<p class="text-gray-500 text-sm italic">No comments yet. Be the first to share your thoughts!</p>';
            return;
        }
    
        
        // Build the initial tree
        commentsArray.forEach((c) => commentList.appendChild(commentNode(c, 0)));
    }
    
    document.getElementById("comment-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        // 1. Correctly target the button inside the form
        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        const originalBtnText = btn.innerHTML; // Save "Post comment" text
        
        const loader = "<div class='w-4 h-4 rounded-full border-2 border-white border-t-transparent animate-spin mx-auto'></div>";
        btn.innerHTML = loader;
        btn.disabled = true; // Prevent double submissions
        
        const input = document.getElementById("comment-input");
        const val = input.value.trim();
        
        if (!val) {
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
            return;
        }
        
        // 2. Send the data to PHP backend
        try {
            const response = await fetch(`${BASE_URL}/blogs/comments/create`, {
                method: 'POST',
                headers: { 
                    'Accept': 'application/json',
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    postSlug: SLUG, 
                    body: val,
                    parentId: null // Explicitly top-level
                })
            });
    
            const { responseResult, responseData, responseCategory } = await response.json();
    
            if (responseCategory == '200') {
                // 3. Clear the input field
                input.value = '';
                
                // 4. Construct the new comment for the UI
                const newComment = {
                    ...responseData,
                    likes: 0,
                    replies: []
                };
                
                const commentList = document.getElementById('comment-list');
                const commentCount = document.getElementById('comment-count');
                
                // Remove the "No comments yet" placeholder if it's the first comment
                const emptyState = commentList.querySelector('p.italic');
                if (emptyState) emptyState.remove();
                
                // 5. Inject at the very top of the list
                commentList.insertBefore(commentNode(newComment, 0), commentList.firstChild);
                
                // 6. Update master count
                commentCount.textContent = parseInt(commentCount.textContent) + 1;
                
                // Optional: Toast notification
                // Swal.fire('Success', 'Comment posted!', 'success');
                
            } else {
                Swal.fire('Oops!!!', `Failed to post comment: ${responseResult}`, 'warning');
            }
        } catch (error) {
            console.error('Error posting comment:', error);
            Swal.fire('Error', 'A network error occurred while posting.', 'error');
        } finally {
            // Restore button state
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
        }
    });

    function compactPostMarkup(post) {
        const readingTime = post.readingTime || Math.max(1, Math.ceil((post.content || '').split(' ').length / 200));
    
        // 1. Safely extract the image or provide a fallback placeholder
        let coverImageUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(post.title)}&background=f3f4f6&color=9ca3af&size=150`;
        if (post.media && Array.isArray(post.media)) {
            const firstImage = post.media.find(m => m.mimeType && m.mimeType.startsWith('image/'));
            if (firstImage) {
                coverImageUrl = `${siteHostAddress || ''}/${firstImage.storagePath}`;
            }
        }
    
        return `
            <a href="${siteHostAddress}/blog/post/${post.slug}" class="group flex items-start gap-4 transition-all mb-6 last:mb-0">
                <!-- Thumbnail -->
                <div class="h-20 w-24 shrink-0 overflow-hidden rounded-lg border border-border bg-surface shadow-sm">
                    <img src="${coverImageUrl}" alt="${post.title}" loading="lazy" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110" />
                </div>
    
                <!-- Content -->
                <div class="flex min-w-0 flex-1 flex-col py-0.5">
                    <div class="mb-1 flex items-center justify-between gap-2 text-[10px] font-bold uppercase tracking-wider text-muted">
                        <span class="text-accent">${getCategoryName(post.category)}</span>
                        <span>${readingTime} min read</span>
                    </div>
    
                    <h4 class="clamp-2 text-sm font-semibold leading-snug text-foreground transition-colors group-hover:text-accent">
                        ${domParser(post.title)}
                    </h4>
    
                    <div class="mt-2 flex items-center gap-3 text-[11px] font-medium text-muted">
                        <span class="flex items-center gap-1">
                            ${heartIcon(true)} ${formatCount(post.likes)}
                        </span>
                        <span>&bull;</span>
                        <span>${formatDate(post.date)}</span>
                    </div>
                </div>
            </a>
        `;
    }
    
    async function fetchSidebarWidget(type, containerId, currentPostId = null, currentPostCategory = null) {
        const containerEl = document.getElementById(containerId);
        
        if (!containerEl) return;
        
        // Show skeleton loader
        containerEl.innerHTML = typeof compactSkeletonLoader === 'function' 
            ? compactSkeletonLoader() 
            : '<div class="animate-pulse h-20 bg-surface rounded-lg mb-4"></div>';
    
        try {
            // Construct the URL dynamically
            let url = `${BASE_URL}/blogs/posts/widget?limit=3&type=${type}`;
            if (type === 'related' && currentPostId) {
                url += `&postId=${currentPostId}&categoryId=${currentPostCategory || ''}`;
            }
    
            const response = await fetch(url, {
                headers: { Accept: "application/json" }
            });
    
            if (!response.ok) {
                throw new Error(`Error: API returned status ${response.status}`);
            }
    
            const { responseData, responseResult, responseCategory } = await response.json();
    
            if (responseCategory == '200') {
                const posts = Array.isArray(responseData) ? responseData : [];
                
                if (posts.length === 0) {
                    containerEl.innerHTML = `<p class="text-xs italic text-muted">No ${type} posts available.</p>`;
                    return;
                }
    
                // Render the compact posts
                containerEl.innerHTML = posts.map(compactPostMarkup).join("");
                
            } else {
                // Throwing the error here safely sends execution to the catch block
                throw new Error(responseResult || 'Failed to fetch widget data');
            }
    
        } catch (error) {
            console.error(`Sidebar Widget Error (${type}):`, error);
            
            // Ensure errorMsgWidget exists before calling it, otherwise use a fallback
            containerEl.innerHTML = `<p class="text-xs text-red-500 p-4 bg-red-50/50 rounded-lg">Unable to load ${type} posts.</p>`; 
        }
    }

        async function onLoadPost(slug){

            const skeleton = document.getElementById("post-skeleton");
            const actualContent = document.getElementById("actual-post-content");
            
            if(!slug){
                swal.fire({
                  title: 'Missing Slug',
                  text: 'Redirecting you to the blog list...',
                  icon: 'info',
                  timer: 3000,
                  showConfirmButton: false
                }).then(() => {
                  window.location.href = `${siteHostAddress}/blog`;
                });
                return;
            }
            
            try{
                const [response, categoryData] = await Promise.all([
                        fetch(`${BASE_URL}/blogs/posts/${encodeURIComponent(slug)}/slug`, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json'
        
                            }
                        }),
                        fetch(`${BASE_URL}/blogs/filter/categories?status=isActive`, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json'
        
                            }
                        })
                    
                    ]) 
                const categoryRecord = await categoryData.json();
                
                const postData = await response.json();
                //  alert(JSON.stringify(categoryRecord));
                const { responseData, responseResult, responseCategory } = postData;
                
                 CATEGORIES = [...CATEGORIES, ...categoryRecord.responseData] || [];
                 
                 if(responseCategory == 200){
                     POST = responseData ?? [];
                    //  renderPost();
                    renderPost(POST);
                    renderComments(POST.comments);
                     skeleton.style.display = "none";
                     actualContent.style.display = "grid";
                     updateViews();
                     // Load Popular Posts
                    fetchSidebarWidget('popular', 'post-popular');
                    // Load Related Stories
                    fetchSidebarWidget('related', 'related', responseData.ltId, responseData.category_id);
                    // update user reaction
                    initializeReactionUI(POST.userReaction);
                 }else{
                     swal.fire('Notice!!!', `${responseResult}`, 'warning');
                    
                 }
                 
            }catch(error){
                 console.log(error);
    
            }
             
        }
         
        // ();



    await onLoadPost(SLUG);
});
