<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<!--<php  ltImport('MdBlog','Editor.js')  ?>-->
<script>


    // State variables
    let COMMENTS = [];
    let search = '';
    let filters = {status: ''}; 
    let entriesPerPage = 10;
    let page = 1;
    let sort = { key: '', dir: 'asc' };
    let editId = null;
    let showFilters = false;

    
    const elements = {

        title: document.getElementById('drawerTitle'),
        tableInfo: document.getElementById('tableInfo'),
        paginationNav: document.getElementById('paginationNav'),
        filterBar: document.getElementById('filterBar'),
        tableBody: document.getElementById('tableBody'),
    }
    // Filter data based on search
    function filterData() {
      return COMMENTS.filter(c => {
        return (
            !search 
            || c.body.toLowerCase().includes(search.toLowerCase())
            );
      });
    }

    
   function getStatusColor(statusValue, type) {
      const statusMap = {
        draft: 'bg-gray-100 text-gray-800',
        published: 'bg-green-100 text-green-800',
        scheduled: 'bg-blue-100 text-blue-800',
        archived: 'bg-red-100 text-red-800'
      };
      
      const iconMap = {
        draft: 'bg-gray-600',
        published: 'bg-green-600',
        scheduled: 'bg-blue-600',
        archived: 'bg-red-600'
      }
    
      // Return mapped value or fallback
      if(type == 'statusMap'){
        return statusMap[statusValue] || 'bg-yellow-100 text-yellow-800';
          
      }else if(type == 'iconMap'){
         return iconMap[statusValue] || 'text-yellow-500';
      }
    }

    
    function domParser(content){
        let text = new DOMParser().parseFromString(content, "text/html").body.textContent;
        return text;
    }
    
    function domReParser(newParserContent){
        let parser = new DOMParser();
        let finalDoc = parser.parseFromString(newParserContent, "text/html");
        let cleanText = finalDoc.body.textContent.trim();
        
        if (cleanText.length > 0) {
            return 1;
        } else {
            return 0;
        }
    }
    
    // Paginate data
    function paginateData(data) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      return data.slice(start, end);
    }

    // Update table with current data
    function updateTable() {
      const filtered = filterData();
      const paginated = paginateData(filtered);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));

      // Update table body
      elements.tableBody.innerHTML = '';
      if (paginated.length === 0) {
        elements.tableBody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-400">No Comment Found.</td></tr>';
      } else {
        paginated.forEach((c, i) => {
          const tr = document.createElement('tr');
          tr.className = `hover:bg-blue-50 transition duration-150 cursor-pointer`;
          tr.innerHTML = `
            <td class="py-3 px-4 border-b border-gray-200 text-center">${(page - 1) * entriesPerPage + i + 1}</td>
            <td class="py-3 px-4 border-b border-gray-200">
                ${c.title}
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${c.author}</td>
            <td class="py-3 px-4 border-b border-gray-200">${c.body}</td>
            <td class="py-3 px-4 border-b border-gray-200">${c.likes}</td>
            <td class="py-3 px-4 border-b border-gray-200">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusColor(c.status, 'statusMap')}" onclick="openStatusDialog(${c.ltId}, '${c.status}')">
                <span class="w-2 h-2 ${getStatusColor(c.status, 'iconMap')} rounded-full mr-1.5 animate-pulse"></span>
                ${c.status.charAt(0).toUpperCase() + c.status.slice(1).toLowerCase()}
              </span>
            </td>
            <td class="py-3 px-4 border-b border-gray-200">${formatTime(c.createdAt)}</td>
            <td class="py-3 px-4 border-b border-gray-200">${formatTime(c.updatedAt)}</td>
            <td class="py-3 px-4 border-b border-gray-200">
              <div class="flex justify-center">
                <button aria-label="View" class="text-green-600 hover:text-amber-700 mx-1 focus:outline-none" data-id="${c.ltId}">
                  View Post
                </button>
                <button aria-label="Delete" class="text-gray-500 hover:text-red-600 mx-1 focus:outline-none" data-id="${c.ltId}">
                  <i class="fas fa-trash-alt text-xl text-red-400"></i>
                </button>
              </div>
            </td>
          `;
          elements.tableBody.appendChild(tr);
        });
      }

      // Update pagination
      updatePagination(total, totalPages);

      // Update table info
      const start = total === 0 ? 0 : (page - 1) * entriesPerPage + 1;
      const end = Math.min(page * entriesPerPage, total);
      elements.tableInfo.textContent = `Showing ${start} to ${end} of ${total} entries`;

      // Add event listeners to table elements
      addTableEventListeners();
    }
    
    function updatePagination(total, totalPages) {
      elements.paginationNav.innerHTML = `
        <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50" id="prevPageBtn" ${page === 1 ? 'Inactive' : ''}>
          <i class="fas fa-chevron-left text-xs"></i>
        </button>
      `;
    
      const maxButtons = 5;
      let startPage, endPage;
    
      if (totalPages <= maxButtons) {
        startPage = 1;
        endPage = totalPages;
      } else if (page <= 3) {
        startPage = 1;
        endPage = 5;
      } else if (page >= totalPages - 2) {
        startPage = totalPages - 4;
        endPage = totalPages;
      } else {
        startPage = page - 2;
        endPage = page + 2;
      }
    
      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
        btn.textContent = i;
        btn.Inactive = page === i;
        btn.addEventListener('click', () => {
          page = i;
          updateTable();
        });
        elements.paginationNav.appendChild(btn);
      }
    
      const nextBtn = document.createElement('button');
      nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50`;
      nextBtn.id = 'nextPageBtn';
      nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
      nextBtn.Inactive = page === totalPages;
      nextBtn.addEventListener('click', () => {
        if (page < totalPages) {
          page++;
          updateTable();
        }
      });
      elements.paginationNav.appendChild(nextBtn);
    
      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (page > 1) {
          page--;
          updateTable();
        }
      });
    }

//  <td class="py-3 px-4 border-b border-gray-200">${getSchoolName(c.schoolId)}</td>

    // Add event listeners to table elements
    function addTableEventListeners() {
    
      // Delete buttons
      document.querySelectorAll('button[aria-label="Delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          deleteComment(ltId);
        });
      });
      
      document.querySelectorAll('button[aria-label="View"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const ltId = e.currentTarget.getAttribute('data-id');
          const postSlug = COMMENTS.find(c => c.ltId == ltId)?.postSlug;
          if(!postSlug) return;
          window.open(`${siteHostAddress}/blog/post/${postSlug}`, '_blank');
        });
      });
      
      
    }

    async function handleDelete(ltId) {
        COMMENTS = COMMENTS.filter(c => +c.ltId !== +ltId);
        updateTable();
   
    }
    


    //// Delete event Listener
     function deleteComment(ltId){
        let res = COMMENTS.find(s => s.ltId == ltId);

        Swal.fire({
            title: 'Notice!',
            text: `Are you sure you want to delete this comment?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
   
                try{
                    
                     const response = await fetch(`${BASE_URL}/blogs/comments/${ltId}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                    const data = await response.json();
                    
                    const {responseData, responseResult, responseCategory} = data;
                    if(responseCategory == '200'){
                        let msg = `Comment Deleted successfully ✌️`;
                        Swal.fire({
                            title: 'Success',
                            text: `${msg}`,
                            icon: 'success',
                            toast: true,
                            position: 'top',
                            showConfirmButton: false,
                            timer: 3000,
                            timerProgressBar: true
                        }).then(function(){
                            handleDelete(ltId);
                        });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    Swal.fire('Error!!!', `${error}`, 'warning');
                }
            }
        }); 
    
    };

    // Initialize event listeners
    function initEventListeners() {
        
        const dialog = document.getElementById('update-status-dialog');
        const closeBtn = document.getElementById('close-status-dialog');
        const cancelBtn = document.getElementById('cancel-status-dialog');
        const saveBtn = document.getElementById('save-status');
        const statusSelect = document.getElementById('status');
        
        // This variable holds the ID of the item (post, comment, etc.) you are updating
        let currentTargetId = null; 
    
        window.openStatusDialog = (id, currentStatus) => {
            currentTargetId = id;
            // console.log(id, cuurentStatus);
            // Pre-select the current status, fallback to pending
            statusSelect.value = currentStatus || 'pending';
            
            // Show the dialog (using flex to maintain your center alignment)
            dialog.classList.remove('hidden');
            dialog.classList.add('flex'); 
        };
    
        // --- Close Logic ---
        const closeDialog = () => {
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
            currentTargetId = null; // Reset the ID
        };
    
        closeBtn?.addEventListener('click', closeDialog);
        cancelBtn?.addEventListener('click', closeDialog);
        
        // Close if the user clicks the dark background outside the modal
        dialog?.addEventListener('click', (e) => {
            if (e.target === dialog) closeDialog();
        });
    
        // --- Submit Logic ---
        saveBtn?.addEventListener('click', async () => {
            if (!currentTargetId) return;
            
            const newStatus = statusSelect.value;
            const originalText = saveBtn.innerHTML;
            
            // Add a spinning loader
            saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            saveBtn.disabled = true;
    
            try {

                const response = await fetch(`${BASE_URL}/blogs/comments/update-status`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${LW_TOKEN}`, 'Accept': 'application/json' },
                    body: JSON.stringify({ ltId: currentTargetId, status: newStatus })
                });
                const { responseCategory } = await response.json();
                
                if (responseCategory == '200') {
                    COMMENTS = COMMENTS.map(c => c.ltId == currentTargetId ? {...c, status: newStatus} : c);
                    closeDialog();
                       
                    updateTable();
                    Swal.fire({
                        title: 'Success',
                        text: 'Status updated successfully.',
                        icon: 'success',
                        toast: true,
                        position: 'top',
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: true
                    });
                } else {
                    Swal.fire('Error', 'Failed to update status.', 'error');
                }
            } catch (error) {
                console.error('Update failed:', error);
                Swal.fire('Network Error', 'Please check your connection.', 'error');
            } finally {
                // Restore the button text and state
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        });
  

      // Search
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        search = e.target.value;
        page = 1;
        updateTable();
      });

      // Clear filters
      document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
        search = '';
        document.getElementById('searchInput').value = '';
        page = 1;
        updateTable();
      });

      // Entries per page
      document.getElementById('entriesPerPageSelect')?.addEventListener('change', (e) => {
        entriesPerPage = parseInt(e.target.value);
        page = 1;
        updateTable();
      });
        
        
    }
    
    function flattenComments(elements, result = []) {
        elements.forEach((el) => {
            // 1. Extract children
            const replies = el.replies;
            let { replies: _, ...commentWithoutReplies } = el; 
            
            // 3. Add the current item to our result array
            // commentWithoutReplies = {...commentWithoutReplies, level: level+1};
            result.push(commentWithoutReplies);
            
            // console.log(level);
            // 4. If children exist, recurse into them
            if (replies && replies.length > 0) {
                flattenComments(replies, result);
            }
        });
        
        return result;
    }
    
    // Initialize the application
    function init() {
        
        async function onLoadPost(){
              
            fx_lifetech_button_loader_open();
            try{
                
                const response = await fetch(`${BASE_URL}/blogs/comments`, {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${LW_TOKEN}`,
                                'Accept': 'application/json'
        
                            }
                        })

               const commentData = await response.json();
                 
                const { responseData, responseResult, responseCategory } = commentData;
                 
                 if(responseCategory == 200){
                     COMMENTS = Array.isArray(responseData) ? flattenComments(responseData) : [];
        
                     updateTable();
                     
                    //  console.log(COMMENTS);
                 }else{
                     Swal.fire('Notice!!!', `${responseResult}`, 'warning')
                 }
                 
                 fx_lifetech_button_loader_close(); 
            }catch(error){
                 
                 console.log(error);
    
            }
             
         }
         
        onLoadPost();    
        
        
      initEventListeners();
    //   updateTable();
    }

    document.addEventListener('DOMContentLoaded', init);
    
    
    
  </script>
