<script>


    // State variables

    let page = 1;
    let sort = { key: '', dir: 'asc' };

        titleInput: document.getElementById("titleInput"),

        categorySelect: document.getElementById("categorySelect"),

        featuredImageAlt: document.getElementById("featuredImageAlt"),
        excerpt: document.getElementById("excerpt"),
        drawer: document.getElementById('postDrawer'),
        title: document.getElementById('drawerTitle'),
        submitPostBtn: document.getElementById('submitPostBtn'),
        tableInfo: document.getElementById('tableInfo'),
        paginationNav: document.getElementById('paginationNav'),
        filterBar: document.getElementById('filterBar'),
        tableBody: document.getElementById('tableBody'),
    }
    
    const contributorEl = {
        authorSelect: document.getElementById('authorSelect'),
        roleSelect: document.getElementById('roleSelect'),
        addAuthorBtn: document.getElementById('addAuthorBtn'),
        contributorsList: document.getElementById('contributorsList'),
        coAuthorsDataInput: document.getElementById('coAuthorsData'),
    }
    
    let mediaCount = document.getElementById('mediaCount');
    let mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
    let additionalMediaInput = document.getElementById('additionalMedia');

    let existingMedia = [];     // Holds the data fetched from the database
    let deletedMediaIds = [];   // Holds the IDs the user wants to remove
    let attachedFiles = [];     // Holds the NEW files being uploaded
    
    var quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],        // toggled buttons
          ['blockquote', 'code-block'],
          ['link', 'video'], 
          
          [{ 'header': 1 }, { 'header': 2 }],               // custom button values
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          [{ 'script': 'sub'}, { 'script': 'super' }],      // superscript/subscript
          [{ 'indent': '-1'}, { 'indent': '+1' }],          // outdent/indent
          [{ 'direction': 'rtl' }],                         // text direction
    
          [{ 'size': ['small', false, 'large', 'huge'] }],  // custom dropdown
          [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
    
          [{ 'color': [] }, { 'background': [] }],          // dropdown with defaults
          [{ 'font': [] }],
          [{ 'align': [] }],
    
          ['clean']                                         // remove formatting button
        ]
      }
    });
    
    if (window.innerWidth < 768) {
      quill.root.style.minHeight = '150px';
    } else {
      quill.root.style.minHeight = '220px';
    }
    

    // Filter data based on search
    function filterData() {
      return posts.filter(p => {
        return (
            !search 
            || p.postName.toLowerCase().includes(search.toLowerCase())
            || p.slugInput.toLowerCase().includes(search.toLowerCase())
            );
      });
    }
    
    
    // Add Contributor Event
    contributorEl.addAuthorBtn.addEventListener('click', () => {
        const authorId = parseInt(authorSelect.value);
        const authorName = contributorEl.authorSelect.options[authorSelect.selectedIndex]?.text;
        const role = contributorEl.roleSelect.value;
    
        // Validation: Ensure an author is selected
        if (!authorId) {
            swal.fire("Oops!!!", 'Please select an author first.', 'info');
            return;
        }
    
        // Validation: Prevent duplicate author assignments
        if (contributors.some(c => c.authorId === authorId)) {
            swal.fire("Oops!!!", 'This author has already been added.', 'info');
            return;
        }
    
        // Add to state
        contributors.push({
            authorId: authorId,
            name: authorName, // Kept in state for UI rendering, but can be stripped later
            role: role
        });
    
        // Reset select
        contributorEl.authorSelect.value = "";
        
        // Update UI and JSON Data
        updateContributorsUI();
    });
    
    function removeContributor(authorId){
        contributors = contributors.filter(a => a.authorId !== authorId);
        // Update UI and JSON Data
        updateContributorsUI();
    }
    
    // Render UI and update hidden JSON input
    function updateContributorsUI() {
        // 1. Render the HTML chips
       contributorEl.contributorsList.innerHTML = contributors.map(contributor => `
            <div class="flex items-center justify-between rounded-md border border-gray-200 bg-white px-4 py-2 text-sm shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="font-medium text-gray-900">${contributor.name}</span>
                    <span class="rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-800 capitalize">
                        ${contributor.role.replace('-', ' ')}
                    </span>
                </div>
                <button type="button" onclick="removeContributor(${contributor.authorId})" class="text-gray-400 hover:text-red-500 focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `).join('');
    
        // 2. Format the exact JSON structure required
        const outputData = contributors.map(c => ({
            authorId: c.authorId,
            name: c.name,
            role: c.role
        }));
    
        // 3. Update the hidden input value
        contributorEl.coAuthorsDataInput.value = JSON.stringify(outputData);
    }
    

    additionalMediaInput.addEventListener('change', function(e) {
        const newFiles = Array.from(e.target.files);
        
        // Calculate how many slots are currently taken
        const activeExistingCount = existingMedia.filter(m => !deletedMediaIds.includes(m.mediaId)).length;
        
        if (attachedFiles.length + activeExistingCount + newFiles.length > 4) {
            Swal.fire('Oops!!!', "You can only attach a maximum of 4 additional files", 'warning');
            additionalMediaInput.value = ''; 
            return;
        }
    
        attachedFiles = attachedFiles.concat(newFiles);
        
        // Re-render the UI
        renderAllMedia();
    });
    
    
    
    function populateCategory(value){
        // let html = '<option value="">-- Select Category --</option>';
        
         let html = categories.map(s => `<option value="${s.ltId}" ${s.ltId == value ? 'selected' : ''}> ${s.categoryName} </option>`).join('');
        return html;
    }
    
    function getCategoryName(catId){
        let category = categories.find(s => s.ltId === +catId);
        return category?.categoryName;
    }
    
   function getStatusColor(statusValue, type) {
      const statusMap = {
        draft: 'bg-gray-100 text-gray-800',
        published: 'bg-green-100 text-green-800',
        scheduled: 'bg-blue-100 text-blue-800',
        archived: 'bg-red-100 text-red-800'
      };
      
      const iconMap = {
        draft: 'bg-gray-600',
        published: 'bg-green-600',
        scheduled: 'bg-blue-600',
        archived: 'bg-red-600'
      }
    
      // Return mapped value or fallback
      if(type == 'statusMap'){
        return statusMap[statusValue] || 'bg-yellow-100 text-yellow-800';
          
      }else if(type == 'iconMap'){
         return iconMap[statusValue] || 'text-yellow-500';
      }
    }
    function decodeHtml(html, id) {
        if (!html) return '';
    
        // 1. Safely unescape HTML entities (e.g., turns &lt;p&gt; back into <p>)
        const textArea = document.createElement('textarea');
        textArea.innerHTML = html;
        let decodedString = textArea.value;
    
        // 2. Run image formatter on the real HTML string
        decodedString = formatMarkdownImages(decodedString, id);
    
        return decodedString;
    }
    
    function domParser(content){
        let text = new DOMParser().parseFromString(content, "text/html").body.textContent;
        return text;
    }
    
    function domReParser(newParserContent){
        let parser = new DOMParser();
        let finalDoc = parser.parseFromString(newParserContent, "text/html");
        let cleanText = finalDoc.body.textContent.trim();
        
        if (cleanText.length > 0) {
            return 1;
        } else {
            return 0;
        }
    }
    
    function formatMarkdownImages(text, postId) {
        return text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, altText, filename) => {
            const basePath = `${siteHostAddress}/storage/uploads/blogs/post_${postId}/`;
            
            const fullPath = filename.startsWith('http') || filename.startsWith('/') 
                ? filename 
                : basePath + filename;
            return `
                <img src="${fullPath}" alt="${altText}" class="ql-image">
            `;
        });
    }
    
    // Paginate data
    function paginateData(data) {
      const start = (page - 1) * entriesPerPage;
      const end = start + entriesPerPage;
      return data.slice(start, end);
    }

    function updatePostsList() {
    const filtered = filterData();
    const paginated = paginateData(filtered);
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / entriesPerPage));
    const container = document.getElementById('postsListContainer');
    const listInfo = document.getElementById('listInfo');

    container.innerHTML = '';

    if (paginated.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center rounded-xl bg-white p-12 text-center shadow-sm border border-gray-100">

    function updatePagination(total, totalPages) {
      elements.paginationNav.innerHTML = `
        <button class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50" id="prevPageBtn" ${page === 1 ? 'Inactive' : ''}>
          <i class="fas fa-chevron-left text-xs"></i>
        </button>
      `;
    
      const maxButtons = 5;
      let startPage, endPage;
    
      if (totalPages <= maxButtons) {
        startPage = 1;
        endPage = totalPages;
      } else if (page <= 3) {
        startPage = 1;
        endPage = 5;
      } else if (page >= totalPages - 2) {
        startPage = totalPages - 4;
        endPage = totalPages;
      } else {
        startPage = page - 2;
        endPage = page + 2;
      }
    
      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium ${page === i ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
        btn.textContent = i;
        btn.Inactive = page === i;
        btn.addEventListener('click', () => {
          page = i;
          updatePostsList();
        });
        elements.paginationNav.appendChild(btn);
      }
    
      const nextBtn = document.createElement('button');
      nextBtn.className = `relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 Inactive:opacity-50`;
      nextBtn.id = 'nextPageBtn';
      nextBtn.innerHTML = '<i class="fas fa-chevron-right text-xs"></i>';
      nextBtn.Inactive = page === totalPages;
      nextBtn.addEventListener('click', () => {
        if (page < totalPages) {
          page++;
          updatePostsList();
        }
      });
      elements.paginationNav.appendChild(nextBtn);
    
      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (page > 1) {
          page--;
          updatePostsList();
        }
      });
    }

    function renderAllMedia() {
        const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
        const mediaCount = document.getElementById('mediaCount');
        
        // Clear the container completely
        mediaPreviewContainer.innerHTML = '';
    
        // Filter out the existing media that the user has marked for deletion
        const activeExistingMedia = existingMedia.filter(media => !deletedMediaIds.includes(media.mediaId));
        
        const totalCount = activeExistingMedia.length + attachedFiles.length;
    
        if (totalCount === 0) {
            mediaPreviewContainer.classList.add('hidden');
            mediaCount.textContent = "No files chosen";
            return;
        }
    
        mediaPreviewContainer.classList.remove('hidden');
        mediaCount.textContent = `${totalCount} file(s) selected`;
    
        // --- STEP A: Render Active Existing Media ---
        activeExistingMedia.forEach(media => {
            const previewDiv = document.createElement('div');
            previewDiv.className = "relative rounded-lg border border-border bg-surface p-2 flex flex-col items-center justify-center text-center overflow-hidden h-32";
            previewDiv.id = `existing-media-${media.mediaId}`; 
    
            const removeBtn = document.createElement('button');
            removeBtn.innerHTML = '&times;';
            removeBtn.className = "absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition z-10";
            
            removeBtn.onclick = (e) => {
                e.preventDefault();
                // Track the ID for the backend
                deletedMediaIds.push(media.mediaId);
                // Re-render the UI
                renderAllMedia(); 
            };
    
            let visual = media.mimeType.startsWith('image/') 
                ? `<img src="${siteHostAddress}/${media.storagePath}" class="absolute inset-0 w-full h-full object-cover opacity-50" />`
                : `<div class="text-gray-500 font-bold text-lg mb-1">${media.originalName.split('.').pop().toUpperCase()}</div>`;
    
            previewDiv.innerHTML = `
                ${visual}
                <span class="text-xs truncate w-full relative z-0 font-medium px-1">${media.originalName}</span>
            `;
            
            previewDiv.appendChild(removeBtn);
            mediaPreviewContainer.appendChild(previewDiv);
        });
    
        // --- STEP B: Render New Attached Files ---
        attachedFiles.forEach((file, index) => {
            const previewDiv = document.createElement('div');
            previewDiv.className = "relative rounded-lg border border-border bg-surface p-2 flex flex-col items-center justify-center text-center overflow-hidden h-32";
    
            const removeBtn = document.createElement('button');
            removeBtn.innerHTML = '&times;';
            removeBtn.className = "absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition z-10";
            
            removeBtn.onclick = (e) => {
                e.preventDefault();
                // Remove from the new files array
                attachedFiles.splice(index, 1);
                // Re-render the UI
                renderAllMedia(); 
            };
    
            let visual = '';
            if (file.type.startsWith('image/')) {
                visual = `<img src="${URL.createObjectURL(file)}" class="absolute inset-0 w-full h-full object-cover opacity-50" />`;
            } else if (file.type === 'application/pdf') {
                visual = `<div class="text-red-500 font-bold text-2xl mb-1">PDF</div>`;
            } else if (file.type.startsWith('video/')) {
                visual = `<div class="text-blue-500 font-bold text-2xl mb-1">VIDEO</div>`;
            } else if (file.type.startsWith('audio/')) {
                visual = `<div class="text-purple-500 font-bold text-2xl mb-1">AUDIO</div>`;
            }
    
            previewDiv.innerHTML = `
                ${visual}
                <span class="text-xs truncate w-full relative z-0 font-medium px-1">${file.name}</span>
                <span class="text-[10px] text-muted relative z-0">${(file.size / (1024 * 1024)).toFixed(2)} MB</span>
            `;
            
            previewDiv.appendChild(removeBtn);
            mediaPreviewContainer.appendChild(previewDiv);
        });
    }

            cancelButtonText: 'No, Cancel'
        }).then(async result => {
            if (result.isConfirmed) {
                try{
                    
                     const response = await fetch(`${BASE_URL}/blogs/posts/${ltId}/toggle-active`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${LW_TOKEN}`,
                            'Accept': 'application/json'
    
                        }
                    });
                
                     const data = await response.json();

                     const {responseData, responseResult, responseCategory} = data;

                    if(responseCategory == '200'){
                         Swal.fire('Notice!!!', `${res.postName} ${resStatusText}d successfully`, 'success').then(function(){
                             posts = posts.map(post => +post.ltId === +ltId ? {...post, status: post.status == 'isActive' ? 'isNotActive' : 'isActive'} : post);
                                updatePostsList();
                         });
                         
                    }else{
                        Swal.fire('Error!!!', `${responseResult}`, 'warning');
                    }
                    
                }catch(error){
                    console.log(error);
                }
            }
        });
        
       
        
    })
  
        elements.titleInput.addEventListener('input', function(){
            elements.slugInput.value = slugify(this.value);
        })

        function slugify(text) {
            return text
                .trim()
                .toLowerCase()
                .replace(/'/g, "")              // Remove apostrophes
                .replace(/&/g, "and")           // Optional: replace &
                .replace(/[^a-z0-9\s-]/g, "")   // Remove other special characters
                .replace(/\s+/g, "-")           // Replace spaces with hyphens
                .replace(/-+/g, "-")            // Remove duplicate hyphens
                .replace(/^-|-$/g, "");         // Trim leading/trailing hyphens
        }  

      // Search
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        search = e.target.value;
        page = 1;
        updatePostsList();
      });

      // Clear filters
      document.getElementById('clearFiltersBtn')?.addEventListener('click', () => {
        search = '';
        document.getElementById('searchInput').value = '';
        page = 1;
        updatePostsList();
      });

      // Entries per page
      document.getElementById('entriesPerPageSelect')?.addEventListener('change', (e) => {
        entriesPerPage = parseInt(e.target.value);
        page = 1;
        updatePostsList();
      });

      // Toggle filters
      document.getElementById('toggleFiltersBtn')?.addEventListener('click', () => {
        showFilters = !showFilters;
        elements.filterBar.classList.toggle('hidden', !showFilters);
        if(showFilters){
            document.getElementById('categoryFilter').innerHTML = populateCategory();
        }
      });

      document.getElementById('addPostBtn')?.addEventListener('click', () => {

       elements.categorySelect.innerHTML = populateCategory();

      });

    

    //   // Drawer buttons
      document.getElementById('closePostDrawerBtn')?.addEventListener('click', closeProfileDrawer);
      document.getElementById('cancelPostBtn')?.addEventListener('click', closeProfileDrawer);
      elements.submitPostBtn?.addEventListener('click', handleFormSubmit);
        
        
    }

                 }
                 
                 fx_lifetech_button_loader_close();

         }
         
        onLoadPost();    
        
        
      initEventListeners();

    document.addEventListener('DOMContentLoaded', init);
    
    
    
  </script>
