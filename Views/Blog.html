/**
 * Typewriter animation for the hero heading.
 *
 */
    
    (() => {
        
         const heading = document.querySelector("[data-typed-heading]");
        if (!heading) {
            return;
        }
    
        // Respect users who prefer reduced motion.
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            return;
        }
    
        // const fullText = heading.textContent.trim();
        const fullText = 'Stories worth the read, from the edges of every field.';
    
        if (!fullText) {
            return;
        }
    
        const TYPE_SPEED = 60;
        let index = 0;
    
        heading.setAttribute("aria-label", fullText);
        heading.textContent = "";
    
        const cursor = document.createElement("span");
        cursor.className = "typed-cursor";
        cursor.setAttribute("aria-hidden", "true");
        cursor.textContent = "";
    
        heading.appendChild(cursor);
    
        function type() {
            if (index >= fullText.length) {
                heading.classList.add("typed-heading-complete");
                return;
            }
    
            cursor.insertAdjacentText("beforebegin", fullText[index]);
            index++;
    
            setTimeout(type, TYPE_SPEED);
        }
    
        type();
        
    })();

    function formatDate(iso) {
        if (!iso) return "";
    
        // const date = new Date(`${iso}T00:00:00`);
        const date = new Date(iso.replace(" ", "T"));
    
        return Number.isNaN(date.getTime())

    function formatCount(n) {
        if (n < 1000) return String(n);
        if (n < 1_000_000) {
            return `${(n / 1000).toFixed(1).replace(/\.0$/, "")}k`;
        }
    
        return `${(n / 1_000_000).toFixed(1).replace(/\.0$/, "")}M`;
    }


    
    function getCategoryName(catId){
        if(typeof catId == 'string') return catId;
        let cat = CATEGORIES.find(c => Number(c.ltId) === Number(catId)).categoryName;
        return cat;
    }
    function getCategoryId(catName){
        if(catName== "" || !catName) return 1;
        if(typeof catName == 'number') return catName;
        
        let cat = CATEGORIES.find(c => c.categoryName.toLowerCase() === catName.toLowerCase()).ltId;
        
        return cat;
    }
    

    // 1. Toggle dropdown visibility
    filtersBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent the click-outside listener from firing immediately
        isDropdownOpen = !isDropdownOpen;
        
        expandIcon.classList.toggle("rotate-180", isDropdownOpen);
        filtersMenu.classList.toggle("hidden", !isDropdownOpen);
        filtersMenu.classList.toggle("flex", isDropdownOpen);
    });
    
    // 2. Close dropdown when clicking outside (Standard UI behavior)
    document.addEventListener('click', (e) => {
        if (isDropdownOpen && !filtersMenu.contains(e.target)) {
            isDropdownOpen = false;
            expandIcon.classList.remove("rotate-180");
            filtersMenu.classList.add("hidden");
            filtersMenu.classList.remove("flex");
        }
    });

// 3. Render the categories inside the dropdown menu
    function renderFiltersByCategory() {
        filtersMenu.innerHTML = ''; // Clear existing
        
        CATEGORIES.forEach((cat) => {
            let active = cat.ltId == getCategoryId(state.category);
            let btn = document.createElement('button');
            btn.type = "button";
            btn.textContent = cat.categoryName;
            btn.dataset.id = cat.ltId;
            btn.setAttribute("aria-pressed", String(active));
            
            // Base classes for a dropdown item
            btn.className = "w-full text-left px-4 py-2 text-sm font-medium transition-colors hover:bg-accent/10 hover:text-accent " + 
                            (active ? "bg-accent/10 text-accent font-bold" : "text-foreground");
            
            btn.addEventListener("click", async function() {
                state.category = cat.ltId;
                
                // Update the main button text to reflect selection
                filtersBtnText.textContent = cat.categoryName;
                
                updateActiveFilter();
                state.page = 1; // Reset to first page
                updateUrl();
                await loadPost(state);
                showClearFilter(false);
    
                // Close the dropdown after making a selection
                isDropdownOpen = false;
                expandIcon.classList.remove("rotate-180");
                filtersMenu.classList.add("hidden");
                filtersMenu.classList.remove("flex");
            });
            
            filtersMenu.appendChild(btn);
        });
        
        // Set initial button text if a category is already selected on page load
        const initialActiveCat = CATEGORIES.find(c => c.ltId == getCategoryId(state.category));
        if (initialActiveCat) {
            filtersBtnText.textContent = initialActiveCat.categoryName;
        }
    }

    // 4. Update the active styling for items inside the dropdown
    function updateActiveFilter() {
        Array.from(filtersMenu.children).forEach(function (btn) {
            var active = Number(btn.dataset.id) === Number(state.category);
            btn.setAttribute("aria-pressed", active);
            
            // Toggle active styling for the dropdown items
            btn.classList.toggle("bg-accent/10", active);
            btn.classList.toggle("text-accent", active);
            btn.classList.toggle("font-bold", active);
            
            // Toggle inactive styling
            btn.classList.toggle("text-foreground", !active);
        });
        
        // Ensure the main button text stays synced (e.g., if filters are cleared elsewhere)
        const activeCat = CATEGORIES.find(c => Number(c.ltId) === Number(state.category));
        filtersBtnText.textContent = activeCat ? activeCat.categoryName : "All Categories";
    }

        function renderCardMarkup(p) {
        const liked = likedSet.has(p.id);
        const likeCount = p.likes + (liked ? 1 : 0);
    
        // 1. Check for a real image
        let coverImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original';
        let attachedFilesCount = 0;
    
        if (p.media && Array.isArray(p.media)) {
            attachedFilesCount = p.media.length;
            const firstImage = p.media.find(m => m.mimeType && m.mimeType.startsWith('image/'));
            
            if (firstImage) {
                coverImageUrl = `${siteHostAddress || ''}/${firstImage.storagePath}`;
            }
        }
    
        // 2. Build conditional image markup
        // If no image is found, we inject a subtle gradient top border instead of a giant placeholder
        const imageBlock = coverImageUrl
            ? `<a href="${siteHostAddress}/blog/post/${p.slug}" class="block overflow-hidden shrink-0 border-b border-border" aria-label="Read: ${domParser(p.title)}"> 
                   <div class="aspect-[16/10] overflow-hidden">
                       <img src="${coverImageUrl}" alt="${p.title}" loading="lazy" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                   </div>
               </a>`
            : `<div class="h-1.5 w-full bg-gradient-to-r from-accent to-accent-soft shrink-0"></div>`; 
    
        // 3. Return the fully responsive card
        return `
            <article class="group animate-fade-up flex flex-col h-full overflow-hidden rounded-2xl border border-border bg-surface transition hover:shadow-lg hover:shadow-black/5">
    
                ${imageBlock}
    
                <!-- Card Body (flex-1 pushes the footer to the bottom) -->
                <div class="flex flex-1 flex-col p-6">
                    
                    <div class="mb-4">
                        <span class="inline-block rounded-full bg-accent-soft px-3 py-1 text-xs font-semibold text-accent-hover">
                            ${getCategoryName(p.category)}
                        </span>
                    </div>
    
                    <a href="${siteHostAddress}/blog/post/${p.slug}" class="flex flex-col flex-1">
                        <h2 class="clamp-2 font-serif text-xl font-bold leading-snug tracking-tight text-foreground transition group-hover:text-accent">
                            ${domParser(p.title)}
                        </h2>
                        
                        <p class="clamp-3 mt-3 text-sm leading-relaxed text-muted">
                            ${domParser(p.excerpt)}
                        </p>
                    </a>
    
                    <!-- Card Footer -->
                    <div class="mt-6 flex items-center justify-between border-t border-border pt-4 text-xs font-medium text-muted">
                        <time datetime="${p.date}">
                            ${formatDate(p.date)}
                        </time>
    
                        <div class="flex items-center gap-4">
                            <button type="button" data-like="${p.id}" aria-pressed="${liked}" aria-label="Like this post" class="flex items-center gap-1.5 transition hover:text-accent ${liked ? "text-accent" : ""}">
                                <span class="like-icon">${heartIcon(liked)}</span>
                                <span class="like-count font-semibold">${formatCount(likeCount)}</span>
                            </button>

        `;

    function renderPage() {
        
        if(POSTS.length === 0){
            noResults.innerHTML = errorMsg('No posts match your search. Try a different term or category.');  
            noResults.classList.remove("hidden");
            postGrid.innerHTML = "";
            paginationEl.innerHTML = "";
            paginationInfo.textContent = "";
            return;
        }
        noResults.classList.add("hidden");
        const pageCount = Math.ceil(state.totalItems / state.limit);
    
        // Ensure current page is within valid range
        state.page = Math.min(state.page, pageCount);
        state.page = Math.max(state.page, 1);
    
        const start = (state.page - 1) * state.limit;
        const end = start + state.limit;
        
        // Build HTML once
        const html = POSTS
            .map(renderCardMarkup)
            .join("");
    
        postGrid.innerHTML = html;
        
        const firstItem = state.totalItems ? start + 1 : 0;
        const lastItem = Math.min(end, state.totalItems);
        // Showing x-y of z
        paginationInfo.textContent =
            firstItem === lastItem
                ? `Showing ${firstItem} of ${state.totalItems} posts`
                : `Showing ${firstItem}-${lastItem} of ${state.totalItems} posts`;

    
        renderPagination(pageCount);
    }

    
    
    function getVisiblePages(pageCount) {
        const pages = [1];
    
        for (let page = state.page - PAGE_WINDOW; page <= state.page + PAGE_WINDOW; page++) {
            if (page > 1 && page < pageCount) {
                pages.push(page);
            }
        }
    
        if (pageCount > 1) {
            pages.push(pageCount);
        }
    
        return [...new Set(pages)].sort((a, b) => a - b);
    }
    
    function paginationButton({label, page, disabled = false, active = false, ariaLabel}) {
        const classes = [
                "pagination-btn",
                active && "is-active",
                disabled && "is-disabled"
            ].filter(Boolean)
            .join(" ");
    
        return `
            <button
                type="button"
                data-page="${page}"
                class="${classes}"
                aria-label="${ariaLabel}"
                aria-disabled="${disabled}"
                ${disabled ? "disabled" : ""}
                ${active ? 'aria-current="page"' : ""}>
                ${label}
            </button>
        `;
    }

    function renderPagination(pageCount) {
        
        if (pageCount <= 1) {
            paginationEl.innerHTML = "";
            paginationInfo.textContent = "";
            return;
        }

        const pages = getVisiblePages(pageCount);
        const html = [];
        

        
        html.push(
            paginationButton({
                label: "First",
                page: 1,
                disabled: state.page === 1,
                ariaLabel: "Go to first page"
            })
        );
        
        html.push(
            paginationButton({
                label: PREV_ICON,
                page: state.page - 1,
                disabled: state.page === 1,
                ariaLabel: "Go to previous page"
            })
        );
    
        pages.forEach((page, index) => {
            if (index > 0 && page - pages[index - 1] > 1) {
                html.push(
                    '<span class="px-2 text-sm text-muted" aria-hidden="true">...</span>'
                );
            }
    
            html.push(
                paginationButton({
                    label: String(page).padStart(2, "0"),
                    page,
                    active: page === state.page,
                    ariaLabel: `Go to page ${page}`
                })
            );
        });

        html.push(
            paginationButton({
                label: NEXT_ICON,
                page: state.page + 1,
                disabled: state.page === pageCount,
                ariaLabel: "Go to next page"
            })
        );
        
        html.push(
            paginationButton({
                label: "Last",
                page: pageCount,
                disabled: state.page === pageCount,
                ariaLabel: "Go to last page"
            })
        );
    
        paginationEl.innerHTML = html.join("");
    }

    async function renderPopularPosts() {
        if (!popularEl) {
            return;
        }
        popularEl.innerHTML = compactSkeletonLoader();
        try {
    
            const response = await fetch(
                `${BASE_URL}/blogs/posts/widget?limit=6&type=popular`,
                {
                    headers: {
                        Accept: "application/json"
                    }
                }
            );
    
            if (!response.ok) {
                throw new Error(`Error, popular post not found`);
            }
    
            const result = await response.json();
            const { responseData, responseResult, responseCategory } = result;
            if(responseCategory == 200){
                 popularPosts = Array.isArray(responseData) ? responseData: [];
                 popularEl.innerHTML = popularPosts
                    .map(compactPostMarkup)
                    .join("");
            }else{
                 throw new Error(`${responseResult}`);
                 popularEl.innerHTML= errorMsgWidget();
            }

        } catch (error) {
            console.error(error);
            popularEl.innerHTML= errorMsgWidget();
        }
        
            
            
    }
    
    function compactPostMarkup(post) {
        let coverImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original';
        if (post.media && Array.isArray(post.media)) {
            const firstImage = post.media.find(m => m.mimeType && m.mimeType.startsWith('image/'));
            
            if (firstImage) {
                coverImageUrl = `${siteHostAddress || ''}/${firstImage.storagePath}`;
            }
        }

        const readTime = Math.max(4, Math.round(post.views / 1200));
        return `
           <a href="${siteHostAddress}/blog/post/${post.slug}" class="compact-post group flex gap-3">
              <img src="${coverImageUrl}" alt="${post.title}" loading="lazy" class="h-full w-24 shrink-0 rounded-lg object-cover" />
            
              <span class="w-full min-w-0">
                <span class="text-muted flex items-center justify-between gap-3 text-xs">
                  <span class="text-accent font-semibold"> ${getCategoryName(post.category)} </span>
            
                  <span> ${readTime} min read </span>
                </span>
            
                <span class="clamp-2 text-foreground group-hover:text-accent mt-1 block font-serif text-base leading-snug font-semibold transition-colors"> ${post.title} </span>
                
                <span class="text-muted mt-1 flex items-center gap-2 text-xs">
                  <span class="flex items-center"> ${heartIcon(true)} </span>
            
                  <span> ${formatCount(post.likes)} appreciations </span>
                </span>
            
                <span class="text-muted mt-1 block text-xs"> ${formatDate(post.date)} ${post.author ? ` • ${post.author}` : ""} </span>
              </span>
            </a>
        `;
    }
    
    searchEl.addEventListener("input", ({ target }) => {
        clearTimeout(debounceTimer);
    
        const value = target.value.trim();
    
        debounceTimer = setTimeout(async () => {
            if (value === state.q) {
                return;
            }
    
            state.q = value;
            state.page = 1; // Reset to first page when searching
            updateUrl();
            await loadPost(state);
            showClearFilter(false);
        }, 300);
    });
    
    sortPosts.addEventListener("change", async ({ target }) => {
    
        const value = target.value.trim();
        if (value === state.sort) return;
        state.sort = value;
        state.page = 1; // Reset to first page when searching
        updateUrl();
        await loadPost(state);
        showClearFilter(false);
    })
    
    paginationEl.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-page]");
    
        if (!button || button.disabled) {
            return;
        }
    
        const page = Number(button.dataset.page);
    
        // Prevent unnecessary re-render
        if (page === state.page) {
            return;
        }
        state.page = Number(page);
        updateUrl();
        
        
        await loadPost(state);
        
    
        filtersEl?.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    });


    function initPost(){
        renderFiltersByCategory();
        renderPage();
    }

    function updateUrl() {
        const params = new URLSearchParams();
        // console.log(state.category);
        // Category
        if (state.category && state.category !== 1) {
            params.set(
                "category",
                getCategoryName(state.category).toLowerCase()
            );
        }
    
        // Search
        if (state.q?.trim()) {
            params.set("q", state.q.trim());
        }
    
        // Page (omit page 1)
        if (state.page > 1) {
            params.set("page", state.page);
        }
    
        // Sort
        if (state.sort && state.sort !== "latest") {
            params.set("sort", state.sort);
        }
    
        const query = params.toString();
    
        const newUrl = query
            ? `${location.pathname}?${query}`
            : location.pathname;
    
        history.pushState(state, "", newUrl);
    }
    
    
    let controller;
    
    async function loadPost(state, onLoad = false) {
        paginationInfo.textContent = "";
    
        controller?.abort();
        controller = new AbortController();
        let category = getCategoryId(state.category);
        
        if(!onLoad){
            postGrid.innerHTML = "";
            noResults.classList.toggle("hidden", false);
            noResults.innerHTML = skeletonLoader(state.limit);
        }
        
        try {
    
            const response = await fetch(
                `${BASE_URL}/blogs/filter/posts?page=${encodeURIComponent(state.page)}&limit=${encodeURIComponent(state.limit)}&q=${encodeURIComponent(state.q)}&category=${encodeURIComponent(category)}&sort=${encodeURIComponent(state.sort)}`,
                {
                    headers: {
                        Accept: "application/json"
                    },
                    signal: controller.signal
                }
            );
    
            if (!response.ok) {
                throw new Error(`Error, post not found`);
            }
    
            const result = await response.json();
            const { responseData, responseResult, responseCategory } = result;
            if(responseCategory == 200){
                 POSTS = Array.isArray(responseData.data) ? responseData.data : [];
                 state.totalItems = responseData.pagination.totalItems;
                 if(!onLoad){
                    renderPage();
                 }
            }else{
                noResults.innerHTML = errorMsg();
                noResults.classList.toggle("hidden", false);
                 throw new Error(`${responseResult}`);
                //  Swal.fire('Notice!!!', `${responseResult}`, 'warning')
            }

        } catch (error) {
            console.error(error);
        }
    
    }

    async function onLoadPost(){
        postGrid.innerHTML = "";
        noResults.classList.toggle("hidden", false);
        noResults.innerHTML = skeletonLoader(state.limit);
        try{
            
                const categoryData = await fetch(`${BASE_URL}/blogs/filter/categories?status=isActive`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'

                    }
                })
                
            const categoryRecord = await categoryData.json();
            
             CATEGORIES = [...CATEGORIES, ...categoryRecord.responseData] || [];
             await loadPost(state, true);
             await renderPopularPosts();
             initPost();
             
        }catch(error){
             noResults.innerHTML = errorMsg();
             noResults.classList.toggle("hidden", false);

        }
    }
    
     
    onLoadPost();
